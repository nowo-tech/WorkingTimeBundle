# REQ-DEMO-013 — Playwright e2e of the management UI against the running demo/symfony8 (FrankenPHP worker, MySQL):
# admin enables the register → a worker clocks in/out and asks for a correction → a manager approves and exports a CSV;
# access control (login redirect, 403) and no horizontal scroll at 390px.
name: Demo e2e

on:
  push:
    branches: [main]
  pull_request:
    # Light mode (docs/GITHUB_CI.md#light-mode-for-deps-and-docs-only-prs): skipped when the PR only touches these.
    # Only allowed because this workflow holds no required check (a path-filtered workflow leaves required checks pending).
    paths-ignore:
      - 'composer.json'
      - 'composer.lock'
      - 'demo/*/composer.json'
      - 'demo/*/composer.lock'
      - 'docs/**'
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'specs/**'
      - '.cursor/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: Demo symfony8 Playwright e2e
    # NOWO_CI_PR_MODE=light skips the e2e on every PR (push and manual runs are never skipped).
    if: ${{ github.event_name != 'pull_request' || vars.NOWO_CI_PR_MODE != 'light' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Start the demo
        run: make -C demo up-symfony8

      - name: Playwright e2e
        run: make test-e2e

      - name: Demo logs on failure
        if: failure()
        run: docker compose -f demo/symfony8/docker-compose.yml logs --tail=200 || true

      - name: Stop the demo
        if: always()
        run: make -C demo down-symfony8
