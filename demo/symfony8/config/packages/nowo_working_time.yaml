# Demo configuration: the register on a private entity manager, UI routes on, exports built in the request (no Messenger).
nowo_working_time:
    doctrine:
        entity_manager: nowo_working_time
    worker_directory: App\WorkingTime\DemoWorkerDirectory
    permissions:
        roles:
            clock: [ROLE_USER]
            manage_team: [ROLE_MANAGER]
            export: [ROLE_MANAGER]
            manage_settings: [ROLE_ADMIN]
    register:
        enabled: true
        export:
            async: sync
            formats: [pdf, csv]
    ui:
        enabled: true
