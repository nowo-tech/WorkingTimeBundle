        summary_mandatory: O resumo mensal não pode ser desativado
        ip_evidence: Registar o prefixo de rede de cada registo de ponto
        ip_evidence_help: Apenas o prefixo /24 (IPv4) ou /64 (IPv6), nunca o endereço, e só com o aviso abaixo.
