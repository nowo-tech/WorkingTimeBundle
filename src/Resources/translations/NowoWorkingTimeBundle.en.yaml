settings:
    title: Working-time settings
    intro: The register is off until you turn it on. The register is a legal record; the bundle is not legal advice.
    save: Save
    saved: The settings were saved.
    stale: Someone saved these settings at the same moment. The form shows them as they are now.
    triggers_missing: '%count% append-only trigger(s) are missing in the database: run nowo:working-time:triggers:install.'
    section:
        register: Register
        register_intro: How the register measures and keeps the time.
    form:
        enabled: Keep the working-hours register
        enabled_help: Workers with the clock permission can clock in and out.
        breaks_counted: Breaks count as worked time
        flex: Flexible band (minutes)
        min_break: Minimum break (minutes)
        min_break_help: Informational flag on days of more than six hours; never blocks clocking.
        daily_overtime: Daily overtime threshold (minutes)
        weekly_overtime: Weekly overtime threshold (minutes)
        task_timer_link: Clocking out stops the task timer
        task_timer_link_help: With TimeTrack installed; the task time stays a separate record.
        reminders_allowed: Workers may ask for clock reminders
        summary_mandatory: The monthly summary cannot be turned off
        ip_evidence: Record the network prefix of each clock action
        ip_evidence_help: Only the /24 (IPv4) or /64 (IPv6) prefix, never the address, and only with the notice below.
        ip_notice: Notice shown to workers
        ip_notice_help: Required to record IP evidence.
        retention: Retention (years)
        retention_help: At least four years (art. 34.9 ET); older months are deleted.
        correction_window: Correction window (days)
    error:
        flex: The flexible band is 0 to 240 minutes.
        min_break: The minimum break is 0 to 120 minutes.
        daily_overtime: The daily threshold is 1 to 720 minutes.
        weekly_overtime: The weekly threshold is 1 to 5040 minutes.
        retention: The retention is 4 to 10 years.
        correction_window: The correction window is 1 to 31 days.
        ip_notice: The notice has at most 2000 characters.
        ip_notice_required: Recording IP evidence needs the notice text shown to workers.
        ip_evidence_off: IP evidence is turned off for this application.
        triggers_missing: The register cannot be turned on while the append-only triggers are missing.
