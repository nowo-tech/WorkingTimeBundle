        task_timer_link_help: Avec TimeTrack installé ; le temps des tâches reste un enregistrement distinct.
        reminders_allowed: Les travailleurs peuvent demander des rappels de pointage
        summary_mandatory: Le résumé mensuel ne peut pas être désactivé
        ip_evidence: Enregistrer le préfixe réseau de chaque pointage
        ip_evidence_help: Uniquement le préfixe /24 (IPv4) ou /64 (IPv6), jamais l'adresse, et seulement avec l'avis ci-dessous.
        ip_notice: Avis affiché aux travailleurs
        ip_notice_help: Requis pour enregistrer la preuve d'IP.
        retention: Conservation (années)
        retention_help: Au moins quatre ans (art. 34.9 du Statut espagnol des travailleurs) ; les mois plus anciens sont supprimés.
        correction_window: Délai de correction (jours)
    error:
        flex: La plage flexible va de 0 à 240 minutes.
        min_break: La pause minimale va de 0 à 120 minutes.
        daily_overtime: Le seuil quotidien va de 1 à 720 minutes.
        weekly_overtime: Le seuil hebdomadaire va de 1 à 5040 minutes.
        retention: La conservation va de 4 à 10 ans.
        correction_window: Le délai de correction va de 1 à 31 jours.
        ip_notice: L'avis comporte 2000 caractères au plus.
        ip_notice_required: Enregistrer la preuve d'IP exige le texte de l'avis affiché aux travailleurs.
        ip_evidence_off: La preuve d'IP est désactivée pour cette application.
        triggers_missing: Le registre ne peut pas être activé tant que les déclencheurs en ajout seul manquent.
